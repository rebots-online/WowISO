[package]
name = "wowiso-gui"
version = "1.4.1347"
description = "Custom Ubuntu 24.04 installer builder GUI (Tauri2; Windows hosts the Python core in WSL2)"
authors = ["Robin L. M. Cheung, MBA <robin@robin.mba>"]
edition = "2021"
rust-version = "1.77"
license = "proprietary"

[lib]
name = "wowiso_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# default = ["custom-protocol"]  # set automatically by tauri-cli on build

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
